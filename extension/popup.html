<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 210px;
      padding: 14px;
      margin: 0;
      background: #0b1329;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .robot-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px auto;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .robot-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    h3 {
      margin: 0;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 700;
    }
    p {
      margin: 4px 0 0 0;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 12px;
      color: #34d399;
      font-size: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="robot-icon">
    <img src="assets/icon128.png" alt="RadAssist" />
  </div>
  <h3>RadAssist Copilot</h3>
  <p>Conectado a RIS / PACS</p>
  <div class="status-badge">● Sistema Listo</div>
</body>
</html>
